<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 660" width="680" height="660" role="img" aria-labelledby="t d">
  <title id="t">移行後の構成図</title>
  <desc id="d">読者は ISR キャッシュと R2 だけに触れる。管理者は Better Auth を通ってエディタから publish を呼び、R2、D1、ISR の順に書く。D1 は管理画面専用。</desc>
  <style>
    svg { --ink:#1c1813; --soft:#837a6c; --line:#d9ceb8; --accent:#c2540c; --ink2:#46557a; --alt:#f2ebdb; --paper:#faf6ec;
      font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --ink:#ede6d8; --soft:#968c7b; --line:#3a3223; --accent:#e8833c; --ink2:#8fa0c8; --alt:#1f1a12; --paper:#14110c; }
    }
    .t { fill:var(--ink); font-size:14px; }
    .s { fill:var(--soft); font-size:11.5px; }
    .m { font-family:"JetBrains Mono",ui-monospace,Menlo,monospace; font-size:11px; fill:var(--soft); }
    .lab { fill:var(--soft); font-size:12px; letter-spacing:.08em; }
    .note { fill:var(--accent); font-size:13px; font-style:italic; }
    .box { fill:var(--paper); stroke:var(--ink); stroke-width:1.4; }
    .box.a { stroke:var(--accent); } .box.b { stroke:var(--ink2); }
    .store { fill:var(--alt); stroke:var(--ink); stroke-width:1.4; }
    .frame { fill:none; stroke:var(--line); stroke-width:1.4; stroke-dasharray:5 5; }
    .arr { fill:none; stroke:var(--ink); stroke-width:1.4; marker-end:url(#h); }
    .arr.a { stroke:var(--accent); marker-end:url(#ha); } .arr.b { stroke:var(--ink2); marker-end:url(#hb); }
    .arr.x { stroke:var(--soft); stroke-dasharray:3 4; }
    .brk { fill:none; stroke:var(--line); stroke-width:1.4; }
    .star { fill:var(--accent); font-size:16px; }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.6"/></marker>
    <marker id="ha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent)" stroke-width="1.6"/></marker>
    <marker id="hb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink2)" stroke-width="1.6"/></marker>
  </defs>
  <rect class="box b" x="105" y="20" width="120" height="34" rx="17"/>
  <text class="t" x="165" y="42" text-anchor="middle">自分 (管理者)</text>
  <rect class="box a" x="455" y="20" width="120" height="34" rx="17"/>
  <text class="t" x="515" y="42" text-anchor="middle">読者</text>
  <rect class="frame" x="20" y="100" width="640" height="350" rx="12"/>
  <text class="m" x="36" y="122" text-anchor="start">Cloudflare Workers (Void アプリ)</text>
  <rect class="box b" x="50" y="150" width="230" height="46" rx="7"/>
  <text class="t" x="165.0" y="170.0" text-anchor="middle">Better Auth</text>
  <text class="m" x="165.0" y="187.0" text-anchor="middle">requireAuth</text>
  <rect class="box b" x="50" y="222" width="230" height="46" rx="7"/>
  <text class="t" x="165.0" y="242.0" text-anchor="middle">エディタ + プレビュー</text>
  <text class="s" x="165.0" y="259.0" text-anchor="middle">CodeMirror 6 + 自作パーサー</text>
  <rect class="box b" x="50" y="294" width="230" height="46" rx="7"/>
  <text class="t" x="165.0" y="314.0" text-anchor="middle">公開</text>
  <text class="m" x="165.0" y="331.0" text-anchor="middle">publish(postId)</text>
  <rect class="box a" x="400" y="294" width="230" height="46" rx="7"/>
  <text class="t" x="515.0" y="322.0" text-anchor="middle" >ISR キャッシュ</text>
  <rect class="box a" x="400" y="366" width="230" height="46" rx="7"/>
  <text class="t" x="515.0" y="386.0" text-anchor="middle">loader</text>
  <text class="s" x="515.0" y="403.0" text-anchor="middle">R2 のオブジェクトだけを読む</text>
  <rect class="store" x="60" y="524" width="220" height="64" rx="10"/>
  <text class="t" x="170" y="552" text-anchor="middle">D1</text>
  <text class="s" x="170" y="572" text-anchor="middle">posts / post_revisions / tags</text>
  <rect class="store" x="400" y="524" width="230" height="64" rx="10"/>
  <text class="t" x="515" y="552" text-anchor="middle">R2</text>
  <text class="s" x="515" y="572" text-anchor="middle">公開スナップショット + 画像</text>
  <path class="arr b" d="M165 54 V149"/>
  <text class="s" x="176" y="84" text-anchor="start">GitHub ログイン</text>
  <path class="arr a" d="M515 54 V293"/>
  <path class="arr b" d="M165 196 V221"/>
  <path class="arr b" d="M165 268 V293"/>
  <text class="s" x="176" y="285" text-anchor="start">公開</text>
  <path class="arr b" d="M280 317 H399"/>
  <text class="m" x="340" y="309" text-anchor="middle">3. revalidate</text>
  <path class="arr a" d="M515 340 V365"/>
  <text class="s" x="526" y="358" text-anchor="start">ミス時</text>
  <path class="arr a" d="M580 412 V523"/>
  <text class="s" x="590" y="468" text-anchor="start">読み取り</text>
  <path class="arr b" d="M200 340 V523"/>
  <text class="m" x="210" y="470" text-anchor="start">2. db.batch</text>
  <path class="arr b" d="M250 340 V478 H450 V523"/>
  <text class="m" x="350" y="470" text-anchor="middle">1. 書き込み</text>
  <path class="arr b" d="M50 245 H34 V490 H100 V523"/>
  <text class="s" x="42" y="508" text-anchor="start">自動保存</text>
  <text class="s" x="40" y="478" text-anchor="start" transform="rotate(-90 40 478)" style="display:none"></text>
  <text class="s" x="400" y="628" text-anchor="middle">琥珀 = 読者の経路 / 青 = 自分だけの経路</text>
  <text class="note" x="170" y="610" text-anchor="middle">読者はここに来ない。</text>
  <text class="star" x="40" y="632">✳</text>
</svg>
